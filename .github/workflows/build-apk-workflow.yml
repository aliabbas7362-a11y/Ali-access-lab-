    - name: Write capacitor.config.json
      run: |
        cat > capacitor.config.json << 'EOF2'
        {
          "appId": "com.aliaccesslabs.cardgame",
          "appName": "Card Game",
          "webDir": "www",
          "server": {
            "url": "https://aliabbas7362-a11y.github.io/Ali-access-lab-/",
            "cleartext": false,
            "allowNavigation": [
              "accounts.google.com",
              "*.google.com",
              "*.firebaseapp.com",
              "card-game-a1e68.firebaseapp.com"
            ]
          }
        }
        EOF2

    - name: Install dependencies
      run: |
        npm install
        npm install @capacitor/local-notifications
        npm install @capacitor/push-notifications
        npm install @capacitor-community/fcm
        npm install @capacitor-community/text-to-speech
        npm install @capacitor/app
        npm install @capacitor/share
        npm install @capacitor/browser
        npm install @capawesome/capacitor-google-sign-in
        echo "==== Capacitor packages installed ===="
        ls node_modules/@capacitor/

    - name: Add Android platform
      run: |
        npx cap add android
        echo "==== Android folder created ===="
        ls -la android/app/src/main/

    - name: Set real Android versionName (fixes update-banner bug)
      run: |
        APP_GRADLE="android/app/build.gradle"
        VERSION="${{ steps.appver.outputs.version }}"
        echo "Setting versionName to $VERSION"
        sed -i "s/versionName \"[^\"]*\"/versionName \"$VERSION\"/" "$APP_GRADLE"
        grep "versionName" "$APP_GRADLE"

    - name: Write google-services.json (needed for FCM push notifications)
      run: |
        cat > android/app/google-services.json << 'EOF3'
        {
          "project_info": {
            "project_number": "495670908374",
            "project_id": "card-game-a1e68",
            "storage_bucket": "card-game-a1e68.firebasestorage.app"
          },
