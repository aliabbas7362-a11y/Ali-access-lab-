        }
        EOF3
        echo "==== google-services.json written ===="
        cat android/app/google-services.json

    - name: Add Google Services Gradle plugin (needed for FCM push notifications)
      run: |
        PROJECT_GRADLE="android/build.gradle"
        APP_GRADLE="android/app/build.gradle"

        if ! grep -q "com.google.gms:google-services" "$PROJECT_GRADLE"; then
          sed -i "/classpath 'com.android.tools.build:gradle/a\\        classpath 'com.google.gms:google-services:4.4.2'" "$PROJECT_GRADLE"
        fi
        echo "==== android/build.gradle ===="
        cat "$PROJECT_GRADLE"

        if ! grep -q "com.google.gms.google-services" "$APP_GRADLE"; then
          echo "" >> "$APP_GRADLE"
          echo "apply plugin: 'com.google.gms.google-services'" >> "$APP_GRADLE"
        fi
        echo "==== android/app/build.gradle ===="
        cat "$APP_GRADLE"

    - name: Sync web assets to Android
      run: |
        npx cap sync android
        echo "==== capacitor.plugins.json ===="
        cat android/app/src/main/assets/capacitor.plugins.json
        echo "==== assets/public contents ===="
        ls -la android/app/src/main/assets/public/

    - name: Add notification permission to AndroidManifest.xml
      run: |
        MANIFEST="android/app/src/main/AndroidManifest.xml"
        if ! grep -q "POST_NOTIFICATIONS" "$MANIFEST"; then
          sed -i '/<manifest /a\    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />' "$MANIFEST"
        fi
        cat "$MANIFEST"

    - name: Add TTS queries block to AndroidManifest.xml
      run: |
        MANIFEST="android/app/src/main/AndroidManifest.xml"
        if ! grep -q "TTS_SERVICE" "$MANIFEST"; then
          cat > /tmp/tts_block.xml << 'EOF'
            <queries>
                <intent>
                    <action android:name="android.intent.action.TTS_SERVICE" />
                </intent>
            </queries>
        EOF
          sed -i -e "/<manifest /r /tmp/tts_block.xml" "$MANIFEST"
        fi
        cat "$MANIFEST"

    - name: Add Google OAuth redirect intent-filter to AndroidManifest.xml
      run: |
        MANIFEST="android/app/src/main/AndroidManifest.xml"
        # Yeh naya intent-filter MainActivity ko "com.aliaccesslabs.cardgame://oauth-callback"
        # link khulte hi wapas foreground mein le aata hai — Google sign-in ke baad
        # oauth-callback.html se yehi link fire hota hai. Bina isske Android is
        # link ko catch hi nahi karega aur browser tab hi khula reh jayega.
        if ! grep -q "oauth-callback" "$MANIFEST"; then
          awk '
            { print }
            /<\/intent-filter>/ && !done {
              print "            <intent-filter>"
              print "                <action android:name=\"android.intent.action.VIEW\" />"
              print "                <category android:name=\"android.intent.category.DEFAULT\" />"
              print "                <category android:name=\"android.intent.category.BROWSABLE\" />"
              print "                <data android:scheme=\"com.aliaccesslabs.cardgame\" android:host=\"oauth-callback\" />"
              print "            </intent-filter>"
              done=1
            }
          ' "$MANIFEST" > /tmp/manifest_new.xml
          mv /tmp/manifest_new.xml "$MANIFEST"
        fi
        echo "==== AndroidManifest.xml (with OAuth intent-filter) ===="
        cat "$MANIFEST"

    - name: Build Debug APK
      working-directory: ./android
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: android/app/build/outputs/apk/debug/*.apk

    - name: Rename APK with version
      run: |
        cp android/app/build/outputs/apk/debug/app-debug.apk \
           android/app/build/outputs/apk/debug/card-game-v${{ steps.appver.outputs.version }}.apk

    - name: Create GitHub Release (public download link — sabko share karne ke liye)
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ steps.appver.outputs.version }}-build${{ github.run_number }}
        name: Card Game v${{ steps.appver.outputs.version }}
        files: android/app/build/outputs/apk/debug/card-game-v${{ steps.appver.outputs.version }}.apk
        body: Automated build. Install this APK to update.
