name: Build APK with Capacitor

on:
  push:
    branches: [ setup-signed-apk ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout setup-signed-apk branch
      uses: actions/checkout@v4
      with:
        ref: setup-signed-apk

    - name: Fetch latest index.html from main branch
      run: |
        git fetch origin main
        git checkout origin/main -- index.html

    - name: Get app version from index.html
      id: appver
      run: |
        VERSION=$(grep -oP "CURRENT_APP_VERSION = '\K[^']+" index.html)
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "Detected app version: $VERSION"

    - name: Prepare web assets
      run: |
        mkdir -p www
        cp -f index.html www/
        for dir in assets css js images fonts img stylesheets scripts sounds; do
          if [ -d "$dir" ]; then
            cp -r "$dir" www/
            echo "Copied $dir/"
          fi
        done
        if [ -f "sw.js" ]; then
          cp -f sw.js www/
          echo "Copied sw.js"
        fi
        echo "==== www/ contents ===="
        ls -la www/

    - name: Clean previous build artifacts
      run: |
        rm -rf android
        rm -rf node_modules
        rm -f package-lock.json
        rm -f capacitor.config.json
        echo "==== Cleaned old state ===="

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: Verify Node version
      run: |
        echo "Node: $(node --version)"
        echo "NPM: $(npm --version)"

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

