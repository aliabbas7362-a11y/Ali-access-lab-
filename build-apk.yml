name: Build APK with Capacitor

on:
  push:
    branches: [ setup-signed-apk ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout setup-signed-apk branch
      uses: actions/checkout@v4
      with:
        ref: setup-signed-apk

    - name: Fetch latest index.html from main branch
      run: |
        git fetch origin main
        git checkout origin/main -- index.html

    - name: Get app version from index.html
      id: appver
      run: |
        VERSION=$(grep -oP "CURRENT_APP_VERSION = '\K[^']+" index.html)
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "Detected app version: $VERSION"

    - name: Prepare web assets
      run: |
        mkdir -p www
        cp -f index.html www/
        for dir in assets css js images fonts img stylesheets scripts sounds; do
          if [ -d "$dir" ]; then
            cp -r "$dir" www/
            echo "Copied $dir/"
          fi
        done
        if [ -f "sw.js" ]; then
          cp -f sw.js www/
          echo "Copied sw.js"
        fi
        echo "==== www/ contents ===="
        ls -la www/

    - name: Clean previous build artifacts
      run: |
        rm -rf android
        rm -rf node_modules
        rm -f package-lock.json
        rm -f capacitor.config.json
        echo "==== Cleaned old state ===="

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: Verify Node version
      run: |
        echo "Node: $(node --version)"
        echo "NPM: $(npm --version)"

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Write capacitor.config.json
      run: |
        cat > capacitor.config.json << 'EOF2'
        {
          "appId": "com.aliaccesslabs.cardgame",
          "appName": "Card Game",
          "webDir": "www",
          "server": {
            "url": "https://aliabbas7362-a11y.github.io/Ali-access-lab-/",
            "cleartext": false,
            "allowNavigation": [
              "accounts.google.com",
              "*.google.com",
              "*.firebaseapp.com",
              "card-game-a1e68.firebaseapp.com"
            ]
          }
        }
        EOF2

    - name: Install dependencies
      run: |
        npm install
        npm install @capacitor/local-notifications
        npm install @capacitor/push-notifications
        npm install @capacitor-community/fcm
        npm install @capacitor-community/text-to-speech
        npm install @capacitor/app
        npm install @capacitor/share
        npm install @capawesome/capacitor-google-sign-in
        echo "==== Capacitor packages installed ===="
        ls node_modules/@capacitor/

    - name: Add Android platform
      run: |
        npx cap add android
        echo "==== Android folder created ===="
        ls -la android/app/src/main/

    - name: Set real Android versionName (fixes update-banner bug)
      run: |
        APP_GRADLE="android/app/build.gradle"
        VERSION="${{ steps.appver.outputs.version }}"
        echo "Setting versionName to $VERSION"
        sed -i "s/versionName \"[^\"]*\"/versionName \"$VERSION\"/" "$APP_GRADLE"
        grep "versionName" "$APP_GRADLE"

    - name: Write google-services.json (needed for FCM push notifications)
      run: |
        cat > android/app/google-services.json << 'EOF3'
        {
          "project_info": {
            "project_number": "495670908374",
            "project_id": "card-game-a1e68",
            "storage_bucket": "card-game-a1e68.firebasestorage.app"
          },
          "client": [
            {
              "client_info": {
                "mobilesdk_app_id": "1:495670908374:android:95f97e5b4171cf8fd38077",
                "android_client_info": {
                  "package_name": "com.aliaccesslabs.cardgame"
                }
              },
              "oauth_client": [
                {
                  "client_id": "495670908374-aqb5qkirm078d2964pror4v30g42bi3h.apps.googleusercontent.com",
                  "client_type": 1,
                  "android_info": {
                    "package_name": "com.aliaccesslabs.cardgame",
                    "certificate_hash": "5e8f16062ea3cd2c4a0d547876baa6f38cabf625"
                  }
                },
                {
                  "client_id": "495670908374-plt4l2dsp5s9fqu2pvjg08orci7d4ugl.apps.googleusercontent.com",
                  "client_type": 3
                }
              ],
              "api_key": [
                {
                  "current_key": "AIzaSyDIFirJCVccvb7yhMi1CPvBH--pXIqI4tU"
                }
              ],
              "services": {
                "appinvite_service": {
                  "other_platform_oauth_client": [
                    {
                      "client_id": "495670908374-plt4l2dsp5s9fqu2pvjg08orci7d4ugl.apps.googleusercontent.com",
                      "client_type": 3
                    }
                  ]
                }
              }
            }
          ],
          "configuration_version": "1"
        }
        EOF3
        echo "==== google-services.json written ===="
        cat android/app/google-services.json

    - name: Add Google Services Gradle plugin (needed for FCM push notifications)
      run: |
        PROJECT_GRADLE="android/build.gradle"
        APP_GRADLE="android/app/build.gradle"

        if ! grep -q "com.google.gms:google-services" "$PROJECT_GRADLE"; then
          sed -i "/classpath 'com.android.tools.build:gradle/a\\        classpath 'com.google.gms:google-services:4.4.2'" "$PROJECT_GRADLE"
        fi
        echo "==== android/build.gradle ===="
        cat "$PROJECT_GRADLE"

        if ! grep -q "com.google.gms.google-services" "$APP_GRADLE"; then
          echo "" >> "$APP_GRADLE"
          echo "apply plugin: 'com.google.gms.google-services'" >> "$APP_GRADLE"
        fi
        echo "==== android/app/build.gradle ===="
        cat "$APP_GRADLE"

    - name: Sync web assets to Android
      run: |
        npx cap sync android
        echo "==== capacitor.plugins.json ===="
        cat android/app/src/main/assets/capacitor.plugins.json
        echo "==== assets/public contents ===="
        ls -la android/app/src/main/assets/public/

    - name: Add notification permission to AndroidManifest.xml
      run: |
        MANIFEST="android/app/src/main/AndroidManifest.xml"
        if ! grep -q "POST_NOTIFICATIONS" "$MANIFEST"; then
          sed -i '/<manifest /a\    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />' "$MANIFEST"
        fi
        cat "$MANIFEST"

    - name: Add TTS queries block to AndroidManifest.xml
      run: |
        MANIFEST="android/app/src/main/AndroidManifest.xml"
        if ! grep -q "TTS_SERVICE" "$MANIFEST"; then
          cat > /tmp/tts_block.xml << 'EOF'
            <queries>
                <intent>
                    <action android:name="android.intent.action.TTS_SERVICE" />
                </intent>
            </queries>
        EOF
          sed -i -e "/<manifest /r /tmp/tts_block.xml" "$MANIFEST"
        fi
        cat "$MANIFEST"

    - name: Build Debug APK
      working-directory: ./android
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: android/app/build/outputs/apk/debug/*.apk

    - name: Rename APK with version
      run: |
        cp android/app/build/outputs/apk/debug/app-debug.apk \
           android/app/build/outputs/apk/debug/card-game-v${{ steps.appver.outputs.version }}.apk

    - name: Create GitHub Release (public download link — sabko share karne ke liye)
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ steps.appver.outputs.version }}-build${{ github.run_number }}
        name: Card Game v${{ steps.appver.outputs.version }}
        files: android/app/build/outputs/apk/debug/card-game-v${{ steps.appver.outputs.version }}.apk
        body: Automated build. Install this APK to update.